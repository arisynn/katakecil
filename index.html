<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#F4F8FD" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      :root { color-scheme:light; --kk-boot-bg:#F4F8FD; --kk-boot-card:#FFFFFF; --kk-boot-ink:#172C48; --kk-boot-muted:#506781; --kk-boot-blue:#235DB4; --kk-boot-border:#D5E3F2; }
      @media (prefers-color-scheme:dark) { :root:not([data-app-theme]) { color-scheme:dark; --kk-boot-bg:#081425; --kk-boot-card:#10243D; --kk-boot-ink:#EFF6FF; --kk-boot-muted:#B2C5DA; --kk-boot-blue:#9BC9FF; --kk-boot-border:#294665; } }
      html[data-app-theme="light"] { color-scheme:light; --kk-boot-bg:#F4F8FD; --kk-boot-card:#FFFFFF; --kk-boot-ink:#172C48; --kk-boot-muted:#506781; --kk-boot-blue:#235DB4; --kk-boot-border:#D5E3F2; }
      html[data-app-theme="dark"] { color-scheme:dark; --kk-boot-bg:#081425; --kk-boot-card:#10243D; --kk-boot-ink:#EFF6FF; --kk-boot-muted:#B2C5DA; --kk-boot-blue:#9BC9FF; --kk-boot-border:#294665; }
      html,body,#root { margin:0;min-height:100%;background:var(--kk-boot-bg);color:var(--kk-boot-ink); }
      .kk-v611-loader { box-sizing:border-box;position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;min-height:100dvh;width:100%;padding:calc(54px + env(safe-area-inset-top)) 24px calc(54px + env(safe-area-inset-bottom));background:var(--kk-boot-bg);color:var(--kk-boot-ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;text-align:center; }
      .kk-v611-loader::before { content:"";position:absolute;z-index:-1;inset:-30%;background:radial-gradient(ellipse at 50% 48%,color-mix(in srgb,var(--kk-boot-blue) 10%,transparent),transparent 49%);pointer-events:none; }
      .kk-v611-loader__content { display:flex;flex-direction:column;align-items:center;gap:0;width:min(100%,370px); }
      .kk-v611-loader__eyebrow { font-size:10px;line-height:1.4;font-weight:700;letter-spacing:.19em;color:var(--kk-boot-blue);margin-bottom:27px; }
      .kk-v611-loader__symbol { width:100px;height:100px;display:grid;place-items:center;border-radius:28px;border:1px solid var(--kk-boot-border);background:var(--kk-boot-card);color:var(--kk-boot-blue);box-shadow:0 16px 45px color-mix(in srgb,var(--kk-boot-ink) 9%,transparent);margin-bottom:27px; }
      .kk-v611-loader__symbol img { width:58px;height:58px;object-fit:contain; }
      .kk-v611-loader__turn { transform-origin:32px 22px;animation:kk-v611-turn 2.7s ease-in-out infinite; }
      .kk-v611-loader__brand { font:600 clamp(34px,6vw,42px)/1.12 Georgia,serif;letter-spacing:-.045em;color:var(--kk-boot-ink); }
      .kk-v611-loader__tagline { margin:12px 0 0;font-size:12px;line-height:1.65;color:var(--kk-boot-muted); }
      .kk-v611-loader__dots { display:flex;gap:9px;margin-top:30px;align-items:center;justify-content:center; }
      .kk-v611-loader__dots span { display:block;width:7px;height:7px;border-radius:50%;background:var(--kk-boot-blue);animation:kk-v611-pulse 1.3s ease-in-out infinite; }
      .kk-v611-loader__dots span:nth-child(2) { animation-delay:.18s; }
      .kk-v611-loader__dots span:nth-child(3) { animation-delay:.36s; }
      .kk-v611-loader__message { margin:13px 0 0;color:var(--kk-boot-muted);font-size:12px;line-height:1.5; }
      @keyframes kk-v611-turn { 0%,20%,100% {transform:scaleX(1);} 52% {transform:scaleX(.22);} 72% {transform:scaleX(1);} }
      @keyframes kk-v611-pulse { 0%,75%,100% {opacity:.35;transform:scale(.82);} 35% {opacity:1;transform:scale(1.1);} }
      @media (prefers-reduced-motion:reduce) { .kk-v611-loader__turn,.kk-v611-loader__dots span { animation:none;opacity:1;transform:none; } }
    </style>
    <script>
      (function(){var context=location.pathname.startsWith('/baca/')?'reader':location.pathname.startsWith('/studio')?'studio':'public';
        document.documentElement.setAttribute('data-kk-boot-context',context);
        try{
          var app=localStorage.getItem('appThemePreference');
          var legacy=localStorage.getItem('katakecil_ui_theme_v53');
          var oldReader=localStorage.getItem('katakecil_reader_theme_preference_v62');
          var oldSettings=null;
          try{oldSettings=JSON.parse(localStorage.getItem('quiet_reader_settings')||'null')?.theme||null;}catch(e){}
          var osDark=matchMedia('(prefers-color-scheme:dark)').matches;
          var mode;
          if(app==='dark'||app==='light')mode=app;
          else if(app==='system')mode=osDark?'dark':'light';
          else if(legacy==='dark'||legacy==='light')mode=legacy;
          else {var old=oldReader&&oldReader!=='follow'?oldReader:oldSettings;
            mode=old==='night'||old==='black'?'dark':['white','sepia','calm'].includes(old)?'light':osDark?'dark':'light';}
          localStorage.setItem('appThemePreference',mode);
          document.documentElement.setAttribute('data-app-theme',mode);
          document.documentElement.setAttribute('data-reader-theme',mode==='dark'?'night':'white');
          document.querySelector('meta[name="theme-color"]').setAttribute('content',context==='reader'?(mode==='dark'?'#10243D':'#FFFFFF'):(mode==='dark'?'#081425':'#F4F8FD'));
        }catch(e){var fallback=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-app-theme',fallback);document.documentElement.setAttribute('data-reader-theme',fallback==='dark'?'night':'white');}
      })();
    </script>
    <title>KataKecil — Cerita Kecil, Makna Besar</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/katakecil-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Temukan, simpan, dan baca cerita karya Karisyono di KataKecil." />
    <meta property="og:title" content="KataKecil — Cerita Kecil, Makna Besar" />
    <meta property="og:description" content="Temukan, simpan, dan baca cerita karya Karisyono di KataKecil." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><div class="kk-v611-loader kk-boot-loader" role="status" aria-live="polite" aria-busy="true">
      <div class="kk-v611-loader__content">
        <span class="kk-v611-loader__eyebrow">KATAKECIL</span>
        <div class="kk-v611-loader__symbol" aria-hidden="true"><img src="/brand/katakecil-mark.svg" width="58" height="58" alt=""/></div>
        <strong class="kk-v611-loader__brand">KataKecil</strong>
        <p class="kk-v611-loader__tagline">Setiap cerita punya tempat untuk kembali.</p>
        <div class="kk-v611-loader__dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="kk-v611-loader__message">Menyiapkan KataKecil…</p>
      </div>
    </div></div>
    <script>
      (function(){var context=document.documentElement.getAttribute('data-kk-boot-context');var message=context==='reader'?'Menyiapkan halaman cerita…':context==='studio'?'Memverifikasi akses Studio…':'Menyiapkan KataKecil…';var loader=document.querySelector('.kk-boot-loader');if(loader){loader.setAttribute('aria-label',message);var label=loader.querySelector('.kk-v611-loader__message');if(label)label.textContent=message;var eyebrow=loader.querySelector('.kk-v611-loader__eyebrow');if(eyebrow)eyebrow.textContent=context==='reader'?'RUANG MEMBACA':context==='studio'?'RUANG PENULIS':'KATAKECIL';}})();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
