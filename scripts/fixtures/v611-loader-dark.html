<!doctype html><html lang="id" data-app-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
      :root { color-scheme:light; --kk-boot-bg:#F4F8FD; --kk-boot-card:#FFFFFF; --kk-boot-ink:#172C48; --kk-boot-muted:#506781; --kk-boot-blue:#235DB4; --kk-boot-border:#D5E3F2; }
      @media (prefers-color-scheme:dark) { :root:not([data-app-theme]) { color-scheme:dark; --kk-boot-bg:#081425; --kk-boot-card:#10243D; --kk-boot-ink:#EFF6FF; --kk-boot-muted:#B2C5DA; --kk-boot-blue:#9BC9FF; --kk-boot-border:#294665; } }
      html[data-app-theme="light"] { color-scheme:light; --kk-boot-bg:#F4F8FD; --kk-boot-card:#FFFFFF; --kk-boot-ink:#172C48; --kk-boot-muted:#506781; --kk-boot-blue:#235DB4; --kk-boot-border:#D5E3F2; }
      html[data-app-theme="dark"] { color-scheme:dark; --kk-boot-bg:#081425; --kk-boot-card:#10243D; --kk-boot-ink:#EFF6FF; --kk-boot-muted:#B2C5DA; --kk-boot-blue:#9BC9FF; --kk-boot-border:#294665; }
      html,body,#root { margin:0;min-height:100%;background:var(--kk-boot-bg);color:var(--kk-boot-ink); }
      .kk-v611-loader { box-sizing:border-box;position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;min-height:100dvh;width:100%;padding:calc(54px + env(safe-area-inset-top)) 24px calc(54px + env(safe-area-inset-bottom));background:var(--kk-boot-bg);color:var(--kk-boot-ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;text-align:center; }
      .kk-v611-loader::before { content:"";position:absolute;z-index:-1;inset:-30%;background:radial-gradient(ellipse at 50% 48%,color-mix(in srgb,var(--kk-boot-blue) 10%,transparent),transparent 49%);pointer-events:none; }
      .kk-v611-loader__content { display:flex;flex-direction:column;align-items:center;gap:0;width:min(100%,370px); }
      .kk-v611-loader__eyebrow { font-size:10px;line-height:1.4;font-weight:700;letter-spacing:.19em;color:var(--kk-boot-blue);margin-bottom:27px; }
      .kk-v611-loader__symbol { width:100px;height:100px;display:grid;place-items:center;border-radius:28px;border:1px solid var(--kk-boot-border);background:var(--kk-boot-card);color:var(--kk-boot-blue);box-shadow:0 16px 45px color-mix(in srgb,var(--kk-boot-ink) 9%,transparent);margin-bottom:27px; }
      .kk-v611-loader__symbol svg { width:58px;height:58px; }
      .kk-v611-loader__turn { transform-origin:32px 22px;animation:kk-v611-turn 2.7s ease-in-out infinite; }
      .kk-v611-loader__brand { font:600 clamp(34px,6vw,42px)/1.12 Georgia,serif;letter-spacing:-.045em;color:var(--kk-boot-ink); }
      .kk-v611-loader__tagline { margin:12px 0 0;font-size:12px;line-height:1.65;color:var(--kk-boot-muted); }
      .kk-v611-loader__dots { display:flex;gap:9px;margin-top:30px;align-items:center;justify-content:center; }
      .kk-v611-loader__dots span { display:block;width:7px;height:7px;border-radius:50%;background:var(--kk-boot-blue);animation:kk-v611-pulse 1.3s ease-in-out infinite; }
      .kk-v611-loader__dots span:nth-child(2) { animation-delay:.18s; }
      .kk-v611-loader__dots span:nth-child(3) { animation-delay:.36s; }
      .kk-v611-loader__message { margin:13px 0 0;color:var(--kk-boot-muted);font-size:12px;line-height:1.5; }
      @keyframes kk-v611-turn { 0%,20%,100% {transform:scaleX(1);} 52% {transform:scaleX(.22);} 72% {transform:scaleX(1);} }
      @keyframes kk-v611-pulse { 0%,75%,100% {opacity:.35;transform:scale(.82);} 35% {opacity:1;transform:scale(1.1);} }
      @media (prefers-reduced-motion:reduce) { .kk-v611-loader__turn,.kk-v611-loader__dots span { animation:none;opacity:1;transform:none; } }
    </style></head><body><div id="root"><div class="kk-v611-loader kk-boot-loader" role="status" aria-live="polite" aria-busy="true">
      <div class="kk-v611-loader__content">

        <div class="kk-v611-loader__symbol" aria-hidden="true"><svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 17v31M32 22C25 16 17 16 9 19v28c9-3 17-2 23 3"/><path class="kk-v611-loader__turn" d="M32 22c7-6 15-6 23-3v28c-9-3-17-2-23 3"/></svg></div>
        <strong class="kk-v611-loader__brand">KataKecil</strong>
        <p class="kk-v611-loader__tagline">Setiap cerita punya tempat untuk kembali.</p>
        <div class="kk-v611-loader__dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="kk-v611-loader__message">Membuka perpustakaan…</p>
      </div>
    </div></div>
    </body></html>
