name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run check
      - run: npm run build:android
      - name: Compile testing APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Name and verify APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/KataKecil-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/KataKecil.apk
          test -s artifacts/KataKecil-debug.apk
          test -s artifacts/KataKecil.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify artifacts/KataKecil-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify artifacts/KataKecil.apk
          sha256sum artifacts/KataKecil-debug.apk > artifacts/KataKecil-debug.apk.sha256
          sha256sum artifacts/KataKecil.apk > artifacts/KataKecil.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: KataKecil-testing
          path: artifacts/*
          if-no-files-found: error
